---
- name: Download plugin
  hosts: localhost
  gather_facts: false
  tasks:

    - name: Load shared vars
      ansible.builtin.include_vars:
        file: vars.yml
    
    - name: Create plugin dir
      ansible.builtin.file:
        path: "../plugin"
        state: directory
    
    - name: Download plugin
      ansible.builtin.get_url:
        url: "https://binary.picodata.io/repository/raw-private/training-ops/{{ plugin_name }}"
        dest: ../plugin/

- name: Install packages
  hosts: all
  gather_facts: true
  tasks:

    - name: Set authorized key took from file
      authorized_key:
        user: root
        state: present
        key: |
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGJGajh7oYmqezHFXrPxSWZ14Ps89SivBoFKaw40ZIQ7 a.protsenko@picodata.io
          ssh-rsa  kdy@picodata.io
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICDM4aK08OHwgpHIr+VQKerrNUQvKy3dtxHaulR/STx/ a.badulin@picodata.io
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFJrJHzikB2TKQn6kNZaj7PwRt6oZu+YI8SFABB9PGQM m.laletin@picodata.io

    - name: Install epel-release
      package:
        name:
          - epel-release
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_os_family == 'Debian'

    - block:
      - name: Enable sudo on Alt
        shell: "control sudowheel enabled && control sudo public"
  
      - name: Update apt cache
        apt_rpm:
          update_cache: yes
      when: ansible_os_family == 'Altlinux'

    - name: Install packages
      package:
        name:
          - unzip
          - tar
          - sudo
          - curl
        state: present
