---
# tasks for deploy cluster

- name: Processing check cluster exists
  block:
  - name: ({{ cluster_name }}) Check cluster exists
    ansible.builtin.stat:
      path: '{{ conf_dir }}/{{ cluster_name }}/report.yml'
    register: result_cluster

  - name: ({{ cluster_name }}) Stop if cluster is exists
    ansible.builtin.fail:
      msg: 'Ошибка! На серверах обнаружен установленный кластер picodata! Используйте тег `reconfigure`, если хотите его изменить или расширить!'
    when: result_cluster.stat.exists
    # delegate_to: localhost

  run_once: true
  when: '"reconfigure" not in ansible_run_tags'
# end block

- name: ({{ cluster_name }}) Set tag variable
  ansible.builtin.set_fact:
    tag: 'deploy'
    first_deploy: true

- name: ({{ cluster_name }}) Check admin password is defined
  ansible.builtin.fail:
    msg: 'Ошибка! Пароль администратора должен быть определен (admin_password)!'
  when: admin_password is undefined
  run_once: true
  delegate_to: localhost

- name: ({{ cluster_name }}) Check picodata is installed
  ansible.builtin.stat:
    path: '{{ bin_dir }}/picodata'
  register: result

- name: ({{ cluster_name }}) Set flag for install picodata needed
  ansible.builtin.set_fact:
    install_packages: '{{ not result.stat.exists }}'

- name: ({{ cluster_name }}) Need to install Picodata package
  ansible.builtin.fail:
    msg: 'Ошибка! На серверах кластера необходимо установить пакет picodata!'
  when: install_packages == true and rootless == true
  run_once: true
  delegate_to: localhost

- name: ({{ cluster_name }}) Set flag for skip check install tasks
  ansible.builtin.set_fact:
    skip_check_install: true

- name: ({{ cluster_name }}) Deploy tasks for become
  ansible.builtin.include_tasks:
    file: deploy_become.yml
  when: rootless == false

- name: ({{ cluster_name }}) Generate list of instances per server
  ansible.builtin.include_tasks:
    file: genin.yml

- name: ({{ cluster_name }}) Create dirs with cluster-name
  ansible.builtin.file:
    name: '{{ item }}'
    state: directory
    owner: '{{ user }}'
    group: '{{ group }}'
    mode: '{{ dir_mode }}'
  loop:
    - '{{ conf_dir }}/{{ cluster_name }}'
    - '{{ log_dir }}/{{ cluster_name }}'
    - '{{ data_dir }}/{{ cluster_name }}'
    - '{{ share_dir }}/{{ cluster_name }}'
    - '{{ run_dir }}/{{ cluster_name }}'
    - '{{ cert_dir }}/{{ cluster_name }}'
    - '{{ cert_dir }}/{{ cluster_name }}/pg'
    - '{{ cert_dir }}/{{ cluster_name }}/iproto'
    - '{{ cert_dir }}/{{ cluster_name }}/https'

- name: ({{ cluster_name }}) Create dirs for crash_dumps
  ansible.builtin.file:
    name: '{{ backup_dir }}/{{ cluster_name }}/crash_dumps'
    state: directory
    owner: '{{ user }}'
    group: '{{ group }}'
    mode: '0755'

- name: ({{ cluster_name }}) Create dirs for cluster for rootless
  become_user: '{{ systemd_user }}'
  ansible.builtin.file:
    name: '{{ item }}'
    state: directory
  loop:
    - '{{ systemd_dir }}'
    - '{{ ansible_user_dir }}/.local/state'
  when: systemd_scope == 'user'

- name: Proccessing for supervisord
  block:

  - name: ({{ cluster_name }}) Create dirs for supervisord
    ansible.builtin.file:
      name: '{{ item }}'
      state: directory
      owner: '{{ user }}'
      group: '{{ group }}'
      mode: '{{ dir_mode }}'
    loop:
      - '{{ supervisord_dir }}/{{ cluster_name }}'

  - name: ({{ cluster_name }}) Generate service unit for supervisord
    ansible.builtin.template:
      src: supervisord-unit-service.j2
      dest: '{{ systemd_dir }}/supervisord-{{ cluster_name }}.service'

  - name: ({{ cluster_name }}) Generate cluster config file for supervisord
    ansible.builtin.template:
      src: supervisord-conf.j2
      dest: '{{ supervisord_dir }}/{{ cluster_name }}.conf'
    notify:
      - restart

  - name: ({{ cluster_name }}) Enable systemd service for supervisord
    ansible.builtin.systemd:
      name: 'supervisord-{{ cluster_name }}.service'
      enabled: true
      state: started
      daemon_reload: true
      scope: '{{ systemd_scope }}'
    register: supervisord_service
    environment:
      XDG_RUNTIME_DIR: /run/user/{{uid.stdout}}

  - name: ({{ cluster_name }}) Check restart if needed
    ansible.builtin.set_fact:
      need_restart: false
    when: supervisord_service.changed == true

  when: init_system == 'supervisord' and systemd_scope == 'user'
# end block

- name: ({{ cluster_name }}) Merge systemd params
  ansible.builtin.set_fact:
    systemd_params: '{{ systemd_params_default | ansible.builtin.combine(systemd_params | default({})) }}'

- name: ({{ cluster_name }}) Debug systemd_params
  ansible.builtin.debug:
    var: systemd_params
  run_once: true
  when: debug == true

- name: ({{ cluster_name }}) Generate template file for systemd
  become: true
  become_user: '{{ systemd_user }}'
  ansible.builtin.template:
    src: systemd-unit-service.j2
    dest: '{{ systemd_dir }}/{{ cluster_name }}@.service'
    force: true
  when: init_system == 'systemd' and autonames|bool == false
  notify:
    - restart

- name: Proccessing rootless logrotate
  block:

  - name: ({{ cluster_name }}) Generate logrotate timer for rootless
    ansible.builtin.template:
      src: logrotate.timer.j2
      dest: '{{ systemd_dir }}/logrotate-{{ cluster_name }}.timer'

  - name: ({{ cluster_name }}) Generate logrotate service for rootless
    ansible.builtin.template:
      src: 'logrotate.service.j2'
      dest: '{{ systemd_dir }}/logrotate-{{ cluster_name }}.service'

  - name: ({{ cluster_name }}) Generate logrotate file for rootless
    ansible.builtin.template:
      src: logrotate.j2
      dest: '{{ ansible_user_dir }}/.config/logrotate-{{ cluster_name }}.conf'
      force: true
      validate: '/usr/sbin/logrotate -s {{ ansible_user_dir }}/.local/state/logrotate-{{ cluster_name }}.status -d %s'

  - name: ({{ cluster_name }}) Enable logrotate systemd services for rootless
    ansible.builtin.systemd:
      name: 'logrotate-{{ cluster_name }}.timer'
      enabled: true
      state: started
      daemon_reload: true
      scope: '{{ systemd_scope }}'
      force: true
    environment:
      XDG_RUNTIME_DIR: /run/user/{{uid.stdout}}

  become: true
  become_user: '{{ systemd_user }}'
  when: (log_to == 'file' or audit_to == 'file') and rootless == true and init_system == 'systemd'
# end block

- name: ({{ cluster_name }}) init db_config for 26.X and above
  ansible.builtin.set_fact:
    db_config: '{{ db_config_default | ansible.builtin.combine(db_config | default({})) }}'
    db_config_all: ''
    db_config_tiers: ''
  when: picodata_version is version('26.1', '>=')

- name: ({{ cluster_name }}) init db_config for 25
  ansible.builtin.set_fact:
    db_config: '{{ db_config | default({}) }}'
    db_config_all: ''
    db_config_tiers: ''
  when: picodata_version is version('26.1', '<')

- name: ({{ cluster_name }}) Debug db_config
  debug:
    var: db_config
  run_once: true
  when: debug == true

- name: ({{ cluster_name }}) Fill db_config_all with parameters
  ansible.builtin.set_fact:
    db_config_all: |
      {% for key, value in db_config.items() %}
      ALTER SYSTEM SET "{{ key }}" = {{ value }} FOR ALL TIERS;
      {% endfor %}
  when: db_config is defined

- name: ({{ cluster_name }}) Debug db_config_all
  debug:
    var: db_config_all
  run_once: true
  when: debug == true

- name: ({{ cluster_name }}) Generate sql-file for db_config on cluster
  ansible.builtin.copy:
    content: '{{ db_config_all }}'
    dest: '{{ conf_dir }}/{{ cluster_name }}/dbconfig.sql'
  run_once: true
  when: db_config_all != ""

- name: ({{ cluster_name }}) Debug all host group
  debug:
    msg: "tiers_host_groups: {{ all_host_groups }}"
  run_once: true
  when: debug == true

- name: ({{ cluster_name }}) Copy certs for PG
  become: true
  ansible.builtin.copy:
    src: '{{ item.filename }}'
    dest: '{{ cert_dir }}/{{ cluster_name }}/pg'
    mode: '{{ item.mode }}'
    owner: '{{ user }}'
    group: '{{ group }}'
  loop:
    - { filename: '{{ pg_cert_file }}', mode: '0644' }
    - { filename: '{{ pg_key_file }}', mode: '0640' }
    - { filename: '{{ pg_ca_file }}', mode: '0644' }
  when: pg_ssl == true

- name: ({{ cluster_name }}) Copy certs for iproto
  become: true
  ansible.builtin.copy:
    src: '{{ item.filename }}'
    dest: '{{ cert_dir }}/{{ cluster_name }}/iproto/'
    mode: '{{ item.mode }}'
    owner: '{{ user }}'
    group: '{{ group }}'
  loop:
    - { filename: '{{ iproto_cert_file }}', mode: '0644' }
    - { filename: '{{ iproto_key_file }}', mode: '0640' }
    - { filename: '{{ iproto_ca_file }}', mode: '0644' }
  when: iproto_tls == true

- name: Proccessing for https
  block:

  - name: ({{ cluster_name }}) Copy certs for https
    become: true
    ansible.builtin.copy:
      src: '{{ item.filename }}'
      dest: '{{ cert_dir }}/{{ cluster_name }}/https/'
      mode: '{{ item.mode }}'
      owner: '{{ user }}'
      group: '{{ group }}'
    loop:
      - { filename: '{{ https_cert_file }}', mode: '0644' }
      - { filename: '{{ https_key_file }}', mode: '0640' }

  - name: ({{ cluster_name }}) Copy password file for https key
    become: true
    ansible.builtin.copy:
      src: '{{ https_password_file }}'
      dest: '{{ cert_dir }}/{{ cluster_name }}/https/'
      mode: '0600'
      owner: '{{ user }}'
      group: '{{ group }}'
    when: https_password_file | default('') != ''

  when: https == true
# end block

- name: Proccessing set failure domain
  block:

  - name: ({{ cluster_name }}) Set actual failure domain
    ansible.builtin.set_fact:
      fd: '"G":"{{ group_names }}","H":"{{ inventory_hostname }}"'
    when: ver_fd | int == 2

  - name: ({{ cluster_name }}) Set failure domain for previous version
    ansible.builtin.set_fact:
      fd: '"DC":"{{ group_names }}","HOST":"{{ inventory_hostname }}"'
    when: ver_fd | int  == 1

  - name: ({{ cluster_name }}) Debug failure domain
    ansible.builtin.debug:
      msg: 'fd is {{ fd }}'

  when: not fd_uniq_per_instance
# end block

- name: Reset failed systemd service
  ansible.builtin.command:
    cmd: 'systemctl reset-failed --{{ systemd_scope }} {{ cluster_name }}* --all'
  environment:
    XDG_RUNTIME_DIR: /run/user/{{uid.stdout}}
  changed_when: false
  when: init_system == 'systemd' and real_cnt|int > 0

- name: ({{ cluster_name }}) Init start values
  ansible.builtin.set_fact:
    cnt: 0

- name: ({{ cluster_name }}) Tiers setup
  ansible.builtin.include_tasks:
    file: tiers_setup.yml
  loop: "{{ lookup('ansible.builtin.dict', tiers, wantlist=True) }}"
  loop_control:
    loop_var: tier
    extended: true

- name: ({{ cluster_name }}) Update cluster in supervisord
  ansible.builtin.command:
    cmd: '/usr/bin/supervisorctl -c {{ supervisord_dir }}/{{ cluster_name }}.conf update'
  register: supervisord_update
  when: init_system == 'supervisord'
  changed_when: false

- name: ({{ cluster_name }}) Wait creating admin-sock files for all instances
  ansible.builtin.wait_for:
    path: '{{ run_dir }}/{{ cluster_name }}/{{ item }}.sock'
    state: present
    msg: 'Ошибка ожидания сокет-файла: {{ run_dir }}/{{ cluster_name }}/{{ item }}.sock! Проверьте логи инстанса!'
    timeout: '{{ timeout_admin_sock }}'
  retries: '{{ retries_admin_sock }}'
  loop: '{{ instances_on_host }}'

- name: ({{ cluster_name }}) Generate sql-file for db_config tiers
  ansible.builtin.copy:
    content: '{{ db_config_tiers }}'
    dest: '{{ conf_dir }}/{{ cluster_name }}/dbconfig_tiers.sql'
  run_once: true
  when: db_config_tiers != ""
  notify:
    - apply_db_config

- name: ({{ cluster_name }}) Set sql_file_pre_plugins if sql_file is set (for compability)
  ansible.builtin.set_fact:
    sql_file_pre_plugins: sql_file
  when: sql_file_pre_plugins == '' and sql_file is defined

- name: ({{ cluster_name }}) Copy sql-file pre-plugins on server
  ansible.builtin.copy:
    src: '{{ sql_file_pre_plugins }}'
    dest: '{{ conf_dir }}/{{ cluster_name }}/after_deploy.sql'
  run_once: true
  when: sql_file_pre_plugins != ''
  notify:
    - apply_sql_file_pre

# не рестартуем кластер, если это его первый деплой
- name: ({{ cluster_name }}) Check restart if needed for first deploy
  ansible.builtin.set_fact:
    need_restart: false
  when: first_deploy == true

# создаем ссылки на инстансы кластера, если это его первый деплой
- name: Make links for instance name
  ansible.builtin.include_tasks:
    file: make_links.yml
  when: autonames|bool == true and first_deploy == true and "restore_full" not in ansible_run_tags

- name: Force all notified handlers before install plugins
  ansible.builtin.meta: flush_handlers
  when: '"restore_full" not in ansible_run_tags'

- name: ({{ cluster_name }}) Install plugins
  ansible.builtin.include_tasks:
    file: plugins.yml
  when: plugins | default({}) != {}

- name: ({{ cluster_name }}) Copy sql-file post-plugins on server
  ansible.builtin.copy:
    src: '{{ sql_file_post_plugins }}'
    dest: '{{ conf_dir }}/{{ cluster_name }}/after_plugins.sql'
  run_once: true
  when: sql_file_post_plugins != ''
  notify:
    - apply_sql_file_post

- name: ({{ cluster_name }}) Print instances on hosts
  ansible.builtin.debug:
    var: list_instance_names | default(instances_on_host)
