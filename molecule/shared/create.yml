---
- name: Create Proxmox LXC with DHCP
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Load Molecule configuration vars
      ansible.builtin.include_vars:
        file: "{{ molecule_file }}"
        name: molecule_config

    - name: Ensure local SSH directory exists for temporary keys
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.ssh"
        state: directory
        mode: '0700'

    - name: Generate temporary SSH key pair for Molecule
      community.crypto.openssh_keypair:
        path: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
        type: ed25519
        force: false
      register: temp_ssh_key

    - name: Create LXC container
      community.proxmox.proxmox:
        api_host: "{{ hostvars[item].api_host }}"
        api_user: "{{ hostvars[item].api_user }}"
        api_password: "{{ hostvars[item].api_password }}"
        validate_certs: false
        vmid: "{{ hostvars[item].vmid | int }}"
        node: "{{ hostvars[item].node }}"
        ostemplate: "{{ hostvars[item].template }}"
        hostname: "{{ item }}"
        searchdomain: lab.picodata.int
        nameserver: 10.60.0.1
        password: "TemporarySecurePassword123"
        cores: 1
        memory: 1024
        storage: local
        cmode: shell
        tags: no-netbox
        state: present
        features: "nesting=1"
        description: "{{ temp_ssh_key.public_key if hostvars[item].os | default('') == 'altlinux' else omit }}"
        ostype: "{{ 'unmanaged' if hostvars[item].os | default('') == 'altlinux' else omit }}"
        netif: "{{ '{\"net0\":\"name=eth0,bridge=lab0\"}' if hostvars[item].os | default('') == 'altlinux' else '{\"net0\":\"name=eth0,bridge=lab0,ip=dhcp\"}' }}"
        password: "{{ omit if hostvars[item].os | default('') == 'altlinux' else 'TemporarySecurePassword123' }}"
        pubkey: "{{ omit if hostvars[item].os | default('') == 'altlinux' else temp_ssh_key.public_key }}"
        hookscript: "{{ 'templates:snippets/altlinux-hook.sh' if hostvars[item].os | default('') == 'altlinux' else omit }}"
      loop: "{{ groups['all'] }}"

    - name: Wait for Proxmox configuration to settle
      ansible.builtin.pause:
        seconds: 5

    - name: Start the created LXC container
      community.proxmox.proxmox:
        api_host: "{{ hostvars[item].api_host }}"
        api_user: "{{ hostvars[item].api_user }}"
        api_password: "{{ hostvars[item].api_password }}"
        validate_certs: false
        vmid: "{{ hostvars[item].vmid | int }}"
        node: "{{ hostvars[item].node }}"
        state: started
      loop: "{{ groups['all'] }}"
      register: start_result
      until: start_result is succeeded
      retries: 3
      delay: 10

    - name: Check SSH TCP port availability
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 22
        state: started
        timeout: 100
        delay: 10
      loop: "{{ groups['all'] }}"
