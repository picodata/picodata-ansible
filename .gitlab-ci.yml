spec:
  inputs:
    picodata_version:
      default: "26.1.6.0-noble"
      description: "Версия Picodata для тестирования **(имя пакета ТОЛЬКО под Ubuntu Noble!!!)**"
    picodata_repo:
      default: "https://download.picodata.io"
      description: "Репозиторий для установки пакетов"
      type: string
      options:
        - "https://download.picodata.io"
        - "https://download.binary.picodata.io"
---
stages:
  - test
  - notify

.molecule_base:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_COMMIT_TAG
      when: never    
  tags:
    - proxmox-docker
  image: docker-picodata.binary.picodata.io/ansible-proxmox:latest
  variables:
    JOB_SUFFIX: "$CI_CONCURRENT_PROJECT_ID"
  retry: 1
  script:
    - |
      if echo "$PICODATA_VERSION" | grep "25.2.2.0" ; then PLUGIN_NAME=$PLUGIN_NAME252; else PLUGIN_NAME=$PLUGIN_NAME25; fi
      export PLUGIN_NAME
    - env | grep -i picodata
    - |
      if [ "$PICODATA_VERSION" != "" ]; then
        molecule converge -s "$MOLECULE_SCENARIO" -- -e "package_with_version=$PICODATA_VERSION"
      else
        molecule converge -s "$MOLECULE_SCENARIO"
      fi

molecule:
  extends: .molecule_base
  parallel:
    matrix:
      - PICODATA_VERSION:
        - picodata=25.2.2.0-noble
        - picodata=25.5.9.0-noble
        - picodata=26.1.6.0-noble
        PLUGIN_NAME252: weather_cache_0.1.0-ubuntu_24.04.tar.gz          
        PLUGIN_NAME25: weather_cache_0.2.0-ubuntu_24.04.tar.gz
        ANSIBLE_PYTHON: /usr/bin/python3
        CONTAINER_TEMPLATE: ubuntu-24.04-standard_24.04-2_amd64.tar.zst
        MOLECULE_SCENARIO:
          - systemd
          - rootless
          - supervisord

      - PICODATA_VERSION: 
        - picodata-25.2.2.0
        - picodata-25.5.9.0
        - picodata-26.1.6.0
        CONTAINER_TEMPLATE: rockylinux-8-cloud_20240408_amd64.tar.xz
        PLUGIN_NAME252: weather_cache_0.1.0-centos_8.tar.gz
        PLUGIN_NAME25: weather_cache_0.2.1-centos_8.tar.gz
        ANSIBLE_PYTHON: /usr/libexec/platform-python
        MOLECULE_SCENARIO:
          - systemd
          - rootless
          - supervisord

manual:
  extends: .molecule_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_success
  variables:
    PICODATA_REPO: "$[[ inputs.picodata_repo ]]"
  needs: []
  parallel:
    matrix:
      - PICODATA_VERSION: "$[[ inputs.picodata_version ]]"
        PLUGIN_NAME: weather_cache_0.2.0-ubuntu_24.04.tar.gz
        CONTAINER_TEMPLATE: ubuntu-24.04-standard_24.04-2_amd64.tar.zst
        ANSIBLE_PYTHON: /usr/bin/python3
        MOLECULE_SCENARIO:
          - systemd
          - rootless
          - supervisord

release:
  stage: notify
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG && $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  variables:
    PARENT_PROJECT_NAME: $CI_PROJECT_NAME
    PARENT_VERSION: $CI_COMMIT_TAG
    PARENT_PROJECT_ID: $CI_PROJECT_ID
  inherit:
    variables: false
  trigger:
    project: picodata/devops/builder-ansible
    strategy: mirror
