---
plugin_name: "{{ lookup('ansible.builtin.env', 'PLUGIN_NAME') }}"
repo: "{{ lookup('ansible.builtin.env', 'PICODATA_REPO') | default('https://download.picodata.io', true) }}"
admin_password: 'Ft1hcz1HHHmv2C9qld9D4!'
service_password: "Ft1hcz1HHHmv2C9qld9D4"
auth_webui: false
audit: true
listen_address: '{{ ansible_default_ipv4.address }}'
fd_uniq_per_instance: true
debug: true
db_config:
  raft_wal_count_max: 102400
force_restore: true
extra_vars:
  PICODATA_UNSAFE_DISABLE_PLUGIN_COMPATIBILITY_CHECK: 1
tiers:
  arbiter:
    replicaset_count: 1
    replication_factor: 1
    can_vote: true
    bucket_count: "{{ 0 if picodata_version is version('26.2.1', '>=') else 3000 }}"
    wal_mode: "{{ 'fsync' if picodata_version is version('26.2.1', '>=') else omit }}"
  default:
    replicaset_count: 1
    replication_factor: 3
    can_vote: false
    replication_mode: "{{ 'sync' if picodata_version is version('26.2.1', '>=') else omit }}"
    config:
      memtx:
        memory: 64M
plugins:
  weather_cache:
    path: '../plugin/{{ plugin_name }}'
    services:
      weather_service:
