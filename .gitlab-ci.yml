spec:
  inputs:
    picodata_version:
      default: "picodata=26.1.6.0-noble"
      description: "Версия Picodata для тестирования **(имя пакета ТОЛЬКО под Ubuntu Noble!!!)**"
    picodata_repo:
      default: "https://download.picodata.io"
      description: "Репозиторий для установки пакетов"
      type: string
      options:
        - "https://download.picodata.io"
        - "https://download.binary.picodata.io"
---
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

stages:
  - test
  - deploy
  - release

.molecule_base:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
  tags:
    - proxmox-docker
  variables:
    JOB_SUFFIX: "$CI_CONCURRENT_PROJECT_ID"
  retry: 1
  script:
    - env | grep -i picodata
    - |
      if [ "$PICODATA_VERSION" != "" ]; then
        molecule converge -s "$MOLECULE_SCENARIO" -- -e "package_with_version=$PICODATA_VERSION"
      else
        molecule converge -s "$MOLECULE_SCENARIO"
      fi

molecule:
  extends: .molecule_base
  image: "$ANSIBLE_IMAGE"
  parallel:
    matrix:
      - PICODATA_VERSION:
          - picodata=25.5.10.0-noble
          - picodata=26.1.4.0-noble
          - picodata=26.2.1.0-noble
        ANSIBLE_IMAGE:
          - docker-picodata.binary.picodata.io/ansible-proxmox:latest
          - docker-picodata.binary.picodata.io/ansible-proxmox:2.20
        PLUGIN_NAME: weather_cache_0.2.2-ubuntu_24.04.tar.gz
        ANSIBLE_PYTHON: /usr/bin/python3
        CONTAINER_TEMPLATE: ubuntu-24.04-standard_24.04-2_amd64.tar.zst
        MOLECULE_SCENARIO: &molecule_scenarios
          - systemd
          - rootless
          - supervisord

      - PICODATA_VERSION:
          - picodata=25.5.10.0-resolute
          - picodata=26.2.1.0-resolute
        ANSIBLE_IMAGE: docker-picodata.binary.picodata.io/ansible-proxmox:latest
        PLUGIN_NAME: weather_cache_0.2.2-ubuntu_26.04.tar.gz
        CONTAINER_TEMPLATE: ubuntu-26.04-standard_26.04-1_amd64.tar.zst
        ANSIBLE_PYTHON: /usr/bin/python3
        MOLECULE_SCENARIO: *molecule_scenarios

      - PICODATA_VERSION:
          - picodata-25.5.10.0
          - picodata-26.1.4.0
          - picodata-26.2.1.0
        ANSIBLE_IMAGE: docker-picodata.binary.picodata.io/ansible-proxmox:latest
        CONTAINER_TEMPLATE: rockylinux-8-cloud_20240408_amd64.tar.xz
        PLUGIN_NAME: weather_cache_0.2.2-centos_8.tar.gz
        ANSIBLE_PYTHON: /usr/libexec/platform-python
        MOLECULE_SCENARIO: *molecule_scenarios

      - PICODATA_VERSION:
          - picodata-25.5.10.0
          - picodata-26.1.4.0
          - picodata-26.2.1.0
        ANSIBLE_IMAGE:
          - docker-picodata.binary.picodata.io/ansible-proxmox:latest
          - docker-picodata.binary.picodata.io/ansible-proxmox:2.20
        CONTAINER_TEMPLATE: almalinux-9-default_20260825_amd64.tar.zst
        PLUGIN_NAME: weather_cache_0.2.2-centos_9.tar.gz
        ANSIBLE_PYTHON: /usr/bin/python3
        MOLECULE_SCENARIO: *molecule_scenarios

      - PICODATA_VERSION:
          - picodata=25.5.10.0-trixie
          - picodata=26.1.4.0-trixie
          - picodata=26.2.1.0-trixie
        ANSIBLE_IMAGE: docker-picodata.binary.picodata.io/ansible-proxmox:latest
        CONTAINER_TEMPLATE: debian-13-standard_13.6-1_amd64.tar.zst
        PLUGIN_NAME: weather_cache_0.2.2-debian_13.tar.gz
        ANSIBLE_PYTHON: /usr/bin/python3
        MOLECULE_SCENARIO: *molecule_scenarios

      - PICODATA_VERSION:
          - picodata=25.5.10.0-1.p9
          - picodata=26.1.4.0-1.p9
          - picodata=26.2.1.0-1.p9
        ANSIBLE_IMAGE: docker-picodata.binary.picodata.io/ansible-proxmox:latest
        CONTAINER_TEMPLATE: alt-p9-cloud_20240408_amd64.tar.xz
        PLUGIN_NAME: weather_cache_0.2.2-altlinux_p9.tar.gz
        ANSIBLE_PYTHON: /usr/bin/python3
        OS: "altlinux"
        MOLECULE_SCENARIO: *molecule_scenarios

      - PICODATA_VERSION:
          - picodata=25.5.10.0-1.p10
          - picodata=26.1.4.0-1.p10
          - picodata=26.2.1.0-1.p10
        ANSIBLE_IMAGE: docker-picodata.binary.picodata.io/ansible-proxmox:latest
        CONTAINER_TEMPLATE: alt-p10-cloud_20240408_amd64.tar.xz
        PLUGIN_NAME: weather_cache_0.2.2-altlinux_p10.tar.gz
        ANSIBLE_PYTHON: /usr/bin/python3
        OS: "altlinux"
        MOLECULE_SCENARIO: *molecule_scenarios

manual:
  extends: .molecule_base
  image: docker-picodata.binary.picodata.io/ansible-proxmox:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_success
  variables:
    PICODATA_REPO: "$[[ inputs.picodata_repo ]]"
  needs: []
  parallel:
    matrix:
      - PICODATA_VERSION: "$[[ inputs.picodata_version ]]"
        PLUGIN_NAME: weather_cache_0.2.0-ubuntu_24.04.tar.gz
        CONTAINER_TEMPLATE: ubuntu-24.04-standard_24.04-2_amd64.tar.zst
        ANSIBLE_PYTHON: /usr/bin/python3
        MOLECULE_SCENARIO:
          - systemd
          - rootless
          - supervisord

deploy:
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG && $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  variables:
    PARENT_PROJECT_NAME: $CI_PROJECT_NAME
    PARENT_VERSION: $CI_COMMIT_TAG
    PARENT_PROJECT_ID: $CI_PROJECT_ID
  inherit:
    variables: false
  trigger:
    project: picodata/devops/builder-ansible
    strategy: mirror

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - proxmox-docker
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - awk 'NR>1 && /^## / {exit} {print}' CHANGELOG.md > RELEASENOTES.md
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: RELEASENOTES.md
